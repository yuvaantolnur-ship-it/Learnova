services:
  - type: web
    name: Learnova-app
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: SCORELYTICS_HOSTED
        value: "1"
      - key: SCORELYTICS_ENABLE_EASYOCR
        value: "1"
      - key: SCORELYTICS_PYTHON
        value: python3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
