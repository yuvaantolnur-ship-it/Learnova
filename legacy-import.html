<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import Learnova records</title>
  <script src="/runtime-config.js"></script>
  <script src="/api-client.js"></script>
  <link rel="stylesheet" href="Learnova_login.css">
</head>
<body>
  <h1 class="logo"><span>Learn</span>ova</h1>
  <div class="card">
    <h2>Import old records</h2>
    <p>Select your existing <code>users.json</code> file, then choose your own account. Only that account’s test records and saved school location are sent. Passwords and other accounts are never uploaded.</p>
    <label for="legacyFile">Old users.json file</label>
    <input id="legacyFile" type="file" accept=".json,application/json">
    <label for="legacyAccount">Account to import</label>
    <select id="legacyAccount" disabled>
      <option value="">Choose a file first</option>
    </select>
    <button id="importButton" type="button" disabled>Import selected account</button>
    <p id="importStatus" role="status" aria-live="polite"></p>
    <a href="/">Return to Learnova</a>
  </div>
  <script src="/legacy-import.js"></script>
</body>
</html>
